name: build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  tweak:
    name: Tweak dylib
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        id: locate
        run: |
          if [ -d "tweak" ]; then echo "root=." >> "$GITHUB_OUTPUT"
          elif [ -d "QingPing/tweak" ]; then echo "root=QingPing" >> "$GITHUB_OUTPUT"
          else echo "找不到 tweak 目录"; ls -la; exit 1; fi

      - name: Build dylib
        working-directory: ${{ steps.locate.outputs.root }}/tweak
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          xcrun --sdk iphoneos clang -dynamiclib \
            -arch arm64 -arch arm64e \
            -isysroot "$SDK" \
            -miphoneos-version-min=16.0 \
            -fobjc-arc -O2 \
            -framework UIKit -framework Foundation -framework StoreKit \
            -install_name @rpath/QingPing.dylib \
            -o QingPing.dylib \
            Tweak.m QingPingStore.m QingPingConfig.m
          ls -la QingPing.dylib
          file QingPing.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: QingPing-dylib
          path: ${{ steps.locate.outputs.root }}/tweak/QingPing.dylib

  app:
    name: App ipa
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        id: locate
        run: |
          if [ -d "ios" ]; then echo "root=." >> "$GITHUB_OUTPUT"
          elif [ -d "QingPing/ios" ]; then echo "root=QingPing" >> "$GITHUB_OUTPUT"
          else echo "找不到 ios 目录"; ls -la; exit 1; fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ${{ steps.locate.outputs.root }}/ios
        run: |
          xcodegen generate
          ls -la

      - name: Build app
        working-directory: ${{ steps.locate.outputs.root }}/ios
        run: |
          xcodebuild -project QingPing.xcodeproj -scheme QingPing \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" EXPANDED_CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          ROOT='${{ steps.locate.outputs.root }}'
          mkdir -p out/Payload
          cp -R "$ROOT/ios/build/Build/Products/Release-iphoneos/QingPing.app" out/Payload/
          ENT="$ROOT/ios/QingPing.entitlements"
          brew install ldid >/dev/null 2>&1 || true
          if command -v ldid >/dev/null 2>&1 && [ -f "$ENT" ]; then
            ldid -S"$ENT" "out/Payload/QingPing.app/QingPing"
            echo "--- entitlements ---"
            ldid -e "out/Payload/QingPing.app/QingPing" || true
          else
            echo "ldid 不可用，退回 codesign"
            codesign -f -s - --entitlements "$ENT" --timestamp=none "out/Payload/QingPing.app" || true
          fi
          cd out && zip -qry QingPing.ipa Payload
          ls -la QingPing.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: QingPing-ipa
          path: out/QingPing.ipa
